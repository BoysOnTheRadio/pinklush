<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Profile</title>
<link rel="stylesheet" href="pinklush_admin.css">
<style>

</style>
</head>
<body>
<section class="admin_bg">
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="site-name">Pink Lush Beauty Lounge</div>
            <div class="user-name">Name</div>
        </header>
        <main class="dashboard-main">
            <nav class="sidebar">
                <a href = "admin-dashboard.html" class="nav-button">Dashboard</a>
                <a href = "admin-add-user.html" class="nav-button">Add User</a>
                <a href = "admin-modify-profile.html" class="nav-button active">Modify Profile</a>
                <a href = "admin-modify-service.html" class="nav-button">Modify Service</a>
                <a href = "" class="nav-button">Logout</a>
            </nav>
            <div class="content-area">
                <form class="customer" action="landing-page.html" method="POST">
  <h1 id="pl-admin-header-c">Profile Information</h1>

  <div class="form-group">
    <label for="customer_name" class="pl-input-label">Name</label>
    <input type="text" id="customer_name" value="Christina C. Gomez" required>
  </div>

  <div class="form-group">
    <label for="employee_id" class="pl-input-label">Employee ID</label>
    <input type="text" id="employee_id" value="00001" required>
  </div>

  <div class="form-group">
    <label for="user-name" class="pl-input-label">Username</label>
    <input type="text" id="user-name" value="@cstine" required>
  </div>

  <div class="form-group">
    <label for="password" class="pl-input-label">Password</label>
    <input type="password" id="password" value="ch****za" required>
  </div>

  <div class="form-group">
    <label for="permissions" class="pl-input-label">Permissions</label>
    <select class="pl-select-option" id="permissions" required>
      <option id="base-option" disabled>Select Permissions</option>
      <option>Customer</option>
      <option selected>Employee</option>
    </select>
  </div>

  <button type="submit" class="btn primary">
    Save Changes
  </button>
</form>

            </div>
        </main>
    </div>
</section>
<script src="pinklush_admin.js"></script>
</body>
</html>
