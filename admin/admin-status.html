<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Status</title>
<link rel="stylesheet" href="pinklush_admin.css">
<style>
  .bookings-header {
  font-family: "Playfair Display", serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  color: #333;
}

.search-bar {
  width: 100%;
  max-width: 400px;
  padding: 0.8rem 1.2rem;
  border: 1px solid rgba(255, 105, 180, 0.2);
  border-radius: 8px;
  background-color: rgb(255, 245, 248);
  font-family: "Poppins", sans-serif;
  font-size: 1rem;
  color: #333;
  transition: 0.3s ease;
  margin: 0 0 0 50px;
}

.search-bar::placeholder {
  color: #aaa;
  font-style: italic;
}

.search-bar:focus {
  outline: none;
  border-color: hotpink;
  box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.3);
}

.bookings-table-container {
  overflow-x: auto;
  width: 100%;
  border-radius: 10px;
  border: 1px solid rgba(255, 105, 180, 0.2);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
  background-color: rgb(255, 240, 245);
}

.bookings-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

.bookings-table th,
.bookings-table td {
  padding: 1rem 1.2rem;
  text-align: left;
  border-bottom: 1px solid rgba(255, 105, 180, 0.1);
  font-family: "Poppins", sans-serif;
  font-size: 0.95rem;
  color: #333;
}

.bookings-table th {
  background-color: rgb(255, 223, 228);
  font-weight: 600;
  color: hotpink;
  text-transform: uppercase;
  font-size: 0.9rem;
  position: sticky;
  top: 0;
  z-index: 1;
}

.bookings-table tbody tr:last-child td {
  border-bottom: none;
}

.bookings-table tbody tr:hover {
  background-color: rgb(255, 245, 250);
}

  .content-header {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }

  @media (max-width: 1024px) {
  .dashboard-main {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid rgba(255, 105, 180, 0.2);
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.5rem;
  }
  .nav-button {
    width: auto;
    flex-grow: 1;
    max-width: 180px;
    text-align: center;
  }
  .dashboard-header {
    padding: 1rem 1.5rem;
  }
  .site-name {
    font-size: clamp(1.5rem, 4vw, 2rem);
  }
  .content-area {
    padding: 1.5rem;
  }
  .bookings-header {
    font-size: clamp(1.8rem, 5vw, 2.5rem);
  }
  .search-bar {
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
  }
  .bookings-table th,
  .bookings-table td {
    padding: 0.8rem 1rem;
    font-size: 0.85rem;
  }
}
</style>
</head>
<body>
<section class="admin_bg">
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="site-name">Site Name</div>
            <div class="user-name">Name</div>
        </header>
        <main class="dashboard-main">
            <nav class="sidebar">
                <a href = "" class="nav-button">Dashboard</a>
                <a href = "admin-add-user.html" class="nav-button">Add User</a>
                <a href = "admin-status.html" class="nav-button active">Status</a>
                <a href = "admin-modify-profile.html" class="nav-button">Modify Profile</a>
                <a href = "admin-modify-service.html" class="nav-button">Modify Service</a>
                <a href = "" class="nav-button">Logout</a>
            </nav>
            <div class="content-area">
              <div class="content-header">
                <h1 class="bookings-header">Bookings</h1>
                <input type="search" class="search-bar" placeholder="Search...">
              </div>
                <div class="bookings-table-container">
                    <table class="bookings-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Service</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Number</th>
                                <th>Facebook User</th>
                                <th>Instagram User</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                                <td>XXX</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</section>
<script src="pinklush_admin.js"></script>
</body>
</html>
