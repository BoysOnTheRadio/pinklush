<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Selection</title>
    <link rel = "stylesheet" href = "pinklush.css">
    <style>

    /* Branch Selection Boxes */
        .branch-items {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            width: 100%;
        }

        .branch-box {
            filter: brightness(0.9);
            display: flex;
            flex-direction: column;
            width: 45%;
            height: 300px;
            border-radius: 10px;
            padding: 25px;
            align-items: center;
            justify-content: center;
            background-color: rgb(255, 217, 246);
            margin: 10px;
            gap: 10px;
            transition: all 0.5s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

            .branch-box:hover {
                filter: brightness(1);
                transform: scale(1.05) translateY(-15px);
            }

                .branch-box:hover .image-wrapper {
                    outline: 6px solid pink;
                }

                .branch-box:hover .image-wrapper:before {
                    opacity: 0.15;
                    transform: rotate(5deg) translate(500px, -50px);
                }

                    .image-wrapper {
                    display: flex;
                    outline: 4px white solid;
                    border-radius: 2.5px;;
                    width: 95%;
                    overflow: hidden;
                    position: relative;
                    outline: 3px solid pink;
                    min-height: 100px;
                    min-width: 100px;
                    margin: 10px;
                    }

                    .image-wrapper:before {
                        position: absolute;
                        background-color: white;
                        content: '';
                        height: 400px;
                        width: 75px;
                        opacity: 0.8;
                        box-shadow: 0 0 10px white;
                        transform: rotate(5deg) translate(-300px, -50px);
                        transition: all ease 0.75s;
                    }

        @media (max-width: 800px) {
            .branch-items {
                flex-direction: column;
            }
            .branch-box {
            width: 95%;
            height: 250px;
            }
        }

    </style>
</head>
