<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branch Selection</title>
  <link rel="stylesheet" href="pinklush.css">
  <style>
    .branch-items {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            width: 100%;
        }

    .branch-box {
      filter: brightness(0.9);
      display: flex;
      flex-direction: column;
      width: 50%;
      height: 400px;
      border-radius: 10px;
      align-items: center;
      background-color: rgb(255, 217, 246);
      gap: 10px;
      transition: all 0.5s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin: 20px;
    }

        .branch-box:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .image-wrapper {
        width: 100%;
        height: 180px;
        overflow: hidden;
        position: relative;
        outline: 3px solid pink;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
        }
            .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
            transition: filter 0.5s ease;
            }

            .branch-box:hover .image-wrapper img {
            filter: brightness(1);
            }

                .selected {
                    outline: hotpink 5px solid;
                }

    .branch-details {
      padding: 1rem 1.5rem;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

        .branch-details h2 {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        font-weight: 800;
        color: #e91e63;
        margin-bottom: 0.5rem;
        }

        .branch-details p {
        font-family: 'Poppins', sans-serif;
        font-size: 1rem;
        color: #333;
        margin-bottom: 1rem;
        }

    .branch-details button {
      margin-top: auto;
      align-self: flex-end;
    }
    
    @media (max-width: 868px) {
        .branch-items {
            flex-direction: column;
        }
      .branch-box {
        width: 95%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <section class="pinklush_background">
    <form class="pl-section" action="customer-serviceselection.html" method="GET">
      <h1 id="pl-header-b">Select Your Nearest Branch</h1>
      <div class="branch-items">

        <div class="branch-box" data-id="1">
          <div class="image-wrapper">
            <img src="https://media.istockphoto.com/id/1409329028/vector/no-picture-available-placeholder-thumbnail-icon-illustration-design.jpg?s=612x612&w=0&k=20&c=_zOuJu755g2eEUioiOUdz_mHKJQJn-tDgIAhQzyeKUQ="">
          </div>
          <div class="branch-details">
            <h2>City Center</h2>
            <p>123 Main St, Lapu-Lapu City</p>
          </div>
        </div>

        <div class="branch-box" data-id="1">
          <div class="image-wrapper">
            <img src="https://media.istockphoto.com/id/1409329028/vector/no-picture-available-placeholder-thumbnail-icon-illustration-design.jpg?s=612x612&w=0&k=20&c=_zOuJu755g2eEUioiOUdz_mHKJQJn-tDgIAhQzyeKUQ="">
          </div>
          <div class="branch-details">
            <h2>City Center</h2>
            <p>123 Main St, Lapu-Lapu City</p>
          </div>
        </div>

      </div>
      <input type="hidden" name="branch-id" id="selected" value="">
      <button type="submit" class="btn primary">Choose</button>
    </form>
  </section>

  <script>
    const branchbox = document.querySelectorAll('.branch-box');
        const submitBtn = document.getElementById('submit-btn');
        const hidden = document.getElementById('selected');

        branchbox.forEach(box => {
        box.addEventListener('click', () => {
            document.querySelector('.selected')?.classList.remove('selected');
            box.classList.add('selected');
            hidden.value = box.dataset.id;
            submitBtn.disabled = false;
        });
        });
  </script>
</body>
</html>
